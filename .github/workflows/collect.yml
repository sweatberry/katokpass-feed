name: Сбор рейсов

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Проверить разборщик
        run: python -m unittest discover -s tests

      - name: Прочитать канал
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python collector/collect.py

      - name: Сохранить deals.json
        run: |
          if git diff --quiet -- docs/deals.json; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "katokpass-bot"
          git config user.email "katokpass-bot@users.noreply.github.com"
          git add docs/deals.json
          git commit -m "Обновить рейсы"
          git push
